spring:
  datasource:
    url: jdbc:h2:mem:audit;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${my.consumer-group-id}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
    # 주의. token-state 의 테스트 yml 에서 옮겨온 설정이다. NewTopic 빈이 있으면 Kafka 를 안 띄운 채 도는
    #      컨텍스트도 기동 시 KafkaAdmin 이 토픽 생성을 시도하므로, 이 네 줄이 없으면 컨텍스트마다
    #      KafkaAdmin.operationTimeout(기본 30초) 단위로 멈춘다. 이 네 줄은 AdminClient 자체의 연결·요청
    #      타임아웃이라 브로커가 없을 때 더 빨리 포기한다.
    # 주의. spring.kafka.admin.operation-timeout 한 줄로 바꾸면 브로커가 없을 때 오히려 느려질 수 있다 —
    #      근거와 수치는 token-state·session 의 src/test/resources/application.yml 주석에 있다.
    admin:
      properties:
        request.timeout.ms: 2000
        default.api.timeout.ms: 2000
        socket.connection.setup.timeout.ms: 1000
        socket.connection.setup.timeout.max.ms: 1000

my:
  consumer-retry-attempts: 2
  consumer-retry-interval-ms: 200
  consumer-group-id: audit-test           # 운영 그룹("audit")과 분리 — 스택을 띄워 둔 채 테스트를 돌려도
                                           # 테스트 JVM 이 운영 그룹에 조인해 실제 이벤트를 가져가지 않게
  issuer: http://localhost:9000
  jwk-set-uri: http://localhost:8083/oauth2/jwks   # 토큰을 실제로 검증하는 security 패키지 테스트는 이 값을
                                                   # @DynamicPropertySource 로 각자의 TestJwks 주소로 바꾼다
