plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.starryeye'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.47'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// LogoutControllerTest(@SpringBootTest) 는 MockHttpSession 을 request 에 직접 붙인다.
	// Spring Session 의 SessionRepositoryFilter 는 세션을 쿠키로만 조회하므로 그 방식과 맞지 않는다
	// (spring.session.store-type 은 Boot 3.4 의 SessionProperties 에서 이미 사라진 죽은 키라 효과가 없다).
	// 테스트 JVM 한정으로 SessionAutoConfiguration 자체를 꺼서 서블릿 기본 세션(=MockHttpSession)을 그대로 쓰게 한다.
	systemProperty 'spring.autoconfigure.exclude', 'org.springframework.boot.autoconfigure.session.SessionAutoConfiguration'
}
