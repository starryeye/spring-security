# docker compose -p microservice-as up -d
# gateway(nginx 9000) + mysql + redis. 5개 Spring 서비스는 호스트에서 java -jar 로 기동한다.
#
# 주의. mysql-init 는 데이터 디렉토리가 비어 있을 때만 실행된다. 스키마·계정을 바꾸면
#      `docker compose -p microservice-as down -v` 로 볼륨까지 지우고 다시 띄워야 반영된다.

services:
  nginx:
    image: nginx:1.27
    ports:
      - "9000:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 1111
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # 주의. apache/kafka:3.9.0 은 이 환경에서 pull 이 되지 않았다(수 분간 응답 없음, 재시도 3회 모두
  #      동일). 이미 로컬에 받아져 있던 3.9.x 최신 패치인 3.9.2 로 대신한다 — KRaft 단일 노드 설정은
  #      3.9 라인 안에서 동일하다.
  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
