server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ms_token_state?useSSL=false&allowPublicKeyRetrieval=true
    username: svc_token_state
    password: pw_token_state
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: token-state
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

my:
  refresh-token-ttl-seconds: 1209600      # 14일. 회전마다 갱신된다
  refresh-family-max-seconds: 2592000     # 30일. 회전으로 연장되지 않는 절대 상한

logging:
  level:
    dev.starryeye: DEBUG
