spring:
  datasource:
    url: jdbc:h2:mem:token-state;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${my.consumer-group-id}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
    # 주의. session 의 테스트 yml(session/src/test/resources/application.yml)에서 그대로 옮겨온 설정이다.
    #      이 모듈도 KafkaConsumerConfig 에 NewTopic 빈(sessionLoggedOutTopic, sessionLoggedOutDlt)이 있어,
    #      Kafka 를 안 띄운 채 돌리는 대부분의 @SpringBootTest 컨텍스트(Kafka 를 직접 안 쓰는 나머지)도
    #      기동 시 KafkaAdmin 이 토픽 생성을 시도한다 — 이 네 줄이 없으면 기본 30초
    #      (KafkaAdmin.operationTimeout) 동안 컨텍스트마다 그 자리에서 멈춘다.
    #
    # 주의. spring.kafka.admin.operation-timeout 한 줄로는 이 네 줄을 대신하지 못한다. operationTimeout 은
    #      KafkaAdmin 이 AdminClient 호출 결과를 기다리는 상한(KafkaFuture.get)일 뿐이다. 브로커가 없으면
    #      KafkaAdmin.initialize() 는 첫 호출(updateClusterId 의 describeCluster)에서 실패해 거기서 멈추고
    #      Admin.close(closeTimeout, 기본 10초)로 넘어가는데, operation-timeout 은 이 closeTimeout 을 바꾸지
    #      않는다. 이 네 줄은 AdminClient 자체의 연결·요청 타임아웃이라 호출이 AdminClient 안에서 먼저 실패한다.
    #      broker-less 상태에서 두 방식이 걸리는 시간의 실측 수치는 session 쪽 주석 참고.
    admin:
      properties:
        request.timeout.ms: 2000
        default.api.timeout.ms: 2000
        socket.connection.setup.timeout.ms: 1000
        socket.connection.setup.timeout.max.ms: 1000

my:
  refresh-token-ttl-seconds: 60
  refresh-family-max-seconds: 300
  consumer-retry-attempts: 2
  consumer-retry-interval-ms: 200
  consumer-group-id: token-state-test     # 운영 그룹("token-state")과 분리 — 같이 안 갈라두면 스택을
                                           # 띄워 둔 채 테스트를 돌릴 때 운영 컨슈머 그룹에 조인해 버린다
