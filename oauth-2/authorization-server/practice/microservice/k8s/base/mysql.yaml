apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: microservice-as
spec:
  selector:
    app: mysql
  ports:
    # 주의. MySQL 은 server-first 프로토콜이라 서버가 먼저 greeting 을 보낸다.
    #      포트 이름을 tcp- 로 시작해 Istio 의 프로토콜 자동 감지를 건너뛰게 한다.
    #      이름이 없거나 http- 로 시작하면 사이드카가 HTTP 로 오인해 연결이 끊긴다.
    - name: tcp-mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: microservice-as
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "1111"
            - name: MYSQL_DATABASE
              value: microservice_as
          ports:
            - name: tcp-mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        # 데이터가 살아남을 이유가 없다. ddl-auto: update 와 seed 가 재생성한다.
        - name: data
          emptyDir: {}
