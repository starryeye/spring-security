apiVersion: v1
kind: ServiceAccount
metadata:
  name: token
  namespace: microservice-as
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-config
  namespace: microservice-as
data:
  # 이 트랙이 실제로 부르는 두 곳만 덮는다.
  # user-directory·token-state·session 은 이 트랙에 배포하지 않으며 그 경로를 부르지 않는다.
  # Redis 도 배포하지 않는다 — Lettuce 는 지연 연결이라 없어도 부팅된다.
  #
  # 주의. `my.issuer: http://localhost:9000` 은 원본 application.yml 값 그대로이고 이
  #      ConfigMap 이 덮지 않는다. 위 두 항목과 달리 issuer 는 "이 트랙이 부르지 않는 대상"이
  #      아니라 token 이 스스로 발급자로 내세우는 신원값이다 — 클러스터의 token 파드가
  #      `GET /.well-known/openid-configuration` 을 받으면 issuer·token_endpoint·jwks_uri 를
  #      전부 `http://localhost:9000/...` 로 낸다. 이 트랙은 그 엔드포인트를 부르지 않으므로
  #      오늘 검증에는 영향이 없지만, discovery 문서를 실제로 소비하는 확장을 한다면 이 값도
  #      함께 덮어야 한다.
  application.yml: |
    my:
      signing-base-url: http://signing:8083
      client-registry-base-url: http://client-registry:8085
---
apiVersion: v1
kind: Service
metadata:
  name: token
  namespace: microservice-as
spec:
  selector:
    app: token
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token
  namespace: microservice-as
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token
  template:
    metadata:
      labels:
        app: token
    spec:
      serviceAccountName: token
      containers:
        - name: token
          image: token:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: token-config
