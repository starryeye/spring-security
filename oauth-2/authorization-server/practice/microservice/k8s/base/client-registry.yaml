apiVersion: v1
kind: ServiceAccount
metadata:
  name: client-registry
  namespace: microservice-as
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-registry-config
  namespace: microservice-as
data:
  # 기존 application.yml 을 덮어쓰는 것이 아니라 위에 얹는다.
  # 바뀌는 것은 DB 호스트뿐이고 포트·계정·ddl-auto 는 원본 그대로다.
  application.yml: |
    spring:
      datasource:
        url: jdbc:mysql://mysql:3306/microservice_as
---
apiVersion: v1
kind: Service
metadata:
  name: client-registry
  namespace: microservice-as
spec:
  selector:
    app: client-registry
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-registry
  namespace: microservice-as
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-registry
  template:
    metadata:
      labels:
        app: client-registry
    spec:
      serviceAccountName: client-registry
      containers:
        - name: client-registry
          image: client-registry:local
          imagePullPolicy: IfNotPresent
          env:
            # 주의. my.client-registry-base-url 같은 키를 환경변수로 넘기면 relaxed
            #      binding 이 하이픈을 지워 MY_CLIENTREGISTRYBASEURL 이 된다. 읽는 사람이
            #      원래 키를 복원할 수 없으므로 ConfigMap 을 파일로 얹는 방식만 쓴다.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/
          ports:
            - name: http
              containerPort: 8085
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: client-registry-config
