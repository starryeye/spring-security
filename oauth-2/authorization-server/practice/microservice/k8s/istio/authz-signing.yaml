# signing 에는 엔드포인트가 둘 있고 허용 집합이 다르다.
#   POST /internal/sign  — 서명. 실제 호출자는 token 과 session 둘이다
#                          (session/src/main/java/dev/starryeye/session/client/SigningClient.java,
#                          LogoutTokenDelivery.java — 슬라이스 5 의 back-channel logout 에서
#                          logout token 을 서명하는 경로다. 죽은 코드가 아니다).
#   GET  /oauth2/jwks    — 공개키. 실제 호출자는 token 과 auth 다(session 은 jwks 를 부르지 않는다).
# auth 는 공개키는 읽지만 서명은 하지 않는다. 브라우저를 마주보는 서비스가
# 개인키 보유자에게 무제한 접근권을 갖지 않게 하는 것이 signing 을 따로 뗀 이유다.
#
# 주의. 아래 첫 번째 rule 의 principals 에는 session 이 없다. session 서비스 자체를 이
#      트랙에 배포하지 않았기 때문이다(범위 밖 — Redis·user-directory·consent 가 더 필요하다).
#      뺀 것은 "session 이 /internal/sign 을 안 부른다"는 뜻이 아니라 "이 트랙에 없다"는
#      뜻이다. session 을 이 트랙에 추가로 배포한다면 이 rule 의 principals 에 반드시
#      "cluster.local/ns/microservice-as/sa/session" 을 추가해야 한다. 추가하지 않으면
#      실제 배포 코드(session 의 LogoutTokenDelivery → SigningClient.sign)가 403 으로
#      조용히 막힌다 — back-channel logout 이 깨진다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: signing
  namespace: microservice-as
spec:
  selector:
    matchLabels:
      app: signing
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/microservice-as/sa/token"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/internal/sign"]
    - from:
        - source:
            principals:
              - "cluster.local/ns/microservice-as/sa/token"
              - "cluster.local/ns/microservice-as/sa/auth"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/oauth2/jwks"]
