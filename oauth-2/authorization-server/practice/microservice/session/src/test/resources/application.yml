spring:
  datasource:
    url: jdbc:h2:mem:session;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    # 주의. main 에는 없는, 테스트 전용 admin 타임아웃이다. KafkaTopicConfig 의 NewTopic 빈이 있으면
    #      Kafka 를 안 띄운 채 돌리는 테스트(Kafka 를 직접 안 쓰는 나머지 대부분)에서도 컨텍스트 기동 시
    #      KafkaAdmin 이 토픽 생성을 시도한다 — 기본 30초(KafkaAdmin.operationTimeout, describeCluster
    #      등 AdminClient 호출을 감싸는 .get(timeout, SECONDS) 의 바깥 상한) 동안 붙잡는다. operation-timeout
    #      은 spring.kafka.admin.operation-timeout 으로 YAML 에서 직접 줄일 수 있다(KafkaAutoConfiguration
    #      .kafkaAdmin() 이 이 값을 KafkaAdmin.setOperationTimeout() 에 그대로 넣는다) — 그래서 아래에서
    #      AdminClient 자체의 요청·연결 타임아웃 네 줄 대신 이 한 줄로 단순화했다. fail-fast=false(기본값)
    #      라 실패해도 컨텍스트 기동은 막지 않는다.
    admin:
      operation-timeout: 2s

my:
  issuer: http://localhost:9000
  signing-base-url: http://localhost:8083
  client-registry-base-url: http://localhost:8085
  outbox-poll-interval-ms: 500
