server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ms_session?useSSL=false&allowPublicKeyRetrieval=true
    username: svc_session
    password: pw_session
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # 주의. max.block.ms 를 설정하지 않아 기본값 60초를 그대로 쓴다. OutboxPublisher.publishPending()
      #      의 kafkaTemplate.send(...).get(5, TimeUnit.SECONDS) 는 이것 때문에 실제 상한이 5초가 아니다
      #      — 브로커 메타데이터를 못 받으면 send() 호출 자체가 그 안에서(.get() 이 걸리기도 전에) 최대
      #      60초까지 막힐 수 있다. OutboxPublisher javadoc 참고.

my:
  issuer: http://localhost:9000
  signing-base-url: http://localhost:8083
  client-registry-base-url: http://localhost:8085
  outbox-poll-interval-ms: 500

logging:
  level:
    dev.starryeye: DEBUG
